name: Release

# Publish to npm when a version tag is pushed, e.g. `git tag v1.0.0 && git push --tags`.
# See docs/RELEASING.md for the tag-last release discipline this workflow assumes.
on:
  push:
    tags:
      # OPS-14: only `vMAJOR.MINOR.PATCH[…]` tags. A floating major tag such as
      # `v1` (V3-D8) does not start a release run.
      - "v[0-9]*.[0-9]*.[0-9]*"
  # OPS-14: a rehearsal path. A manual run is a dry run by default: every guard
  # except the ancestry and tag checks, ending in `npm publish --dry-run`, with
  # the tarball listing uploaded as an artifact. A real manual publish
  # (dry_run off) is accepted only on a version tag ref and runs every guard.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: pack and check, publish nothing"
        type: boolean
        default: true
      version:
        description: "Dry run only: rehearse as this version (e.g. 1.0.0-rc.1); empty = package.json"
        type: string
        default: ""

permissions:
  contents: read

# OPS-14: one release run at a time. Two tag pushes queue instead of
# overlapping, and a queued run is never cancelled by a newer one starting.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A protected deployment environment: required reviewers / wait timers are
    # configured in repo Settings → Environments → "release" (user-assisted).
    environment: release
    permissions:
      contents: read
      # Required for npm provenance / OIDC Trusted Publishing (see the publish step).
      id-token: write
    env:
      # "true" only for a manual run with dry_run on; a tag push is never a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the ancestry guard below can compute reachability
          # of the tagged commit from origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
          # Delegated decision 2026-09-28 (wave 13): the job runs `npm ci` in
          # both the root and tessera/, so the cache key covers both lockfiles
          # (a tessera-only lockfile change must not restore a stale cache).
          cache-dependency-path: |
            package-lock.json
            tessera/package-lock.json
      # OPS-14: a dry run may rehearse another version (e.g. the rc while main
      # still says 0.5.0); a real manual publish takes no version and must run
      # on a version tag, so it meets the same guards as a tag push.
      - name: Check the manual-run inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [ -n "$REHEARSAL_VERSION" ] && ! [[ "$REHEARSAL_VERSION" =~ $SEMVER ]]; then
              echo "::error::version input '$REHEARSAL_VERSION' is not a semver version."
              exit 1
            fi
            exit 0
          fi
          if [ -n "$REHEARSAL_VERSION" ]; then
            echo "::error::The version input is for dry runs only; a real publish uses package.json."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::A real manual publish must run on a version tag, not $GITHUB_REF."
              exit 1
              ;;
          esac
      # The substituted version lives only in this runner's checkout; it is
      # never committed or tagged. --ignore-scripts: no version lifecycle hooks.
      - name: Rehearse as the requested version (dry run)
        if: env.DRY_RUN == 'true' && inputs.version != ''
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          npm version "$REHEARSAL_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      # OPS-1: refuse to publish a tag whose commit is not reachable from `main`.
      # Tag pushes bypass branch protection, so a tag on an unreviewed/never-CI'd
      # commit must never reach npm. `fetch-depth: 0` above makes the graph complete.
      # A dry run publishes nothing, so it may rehearse any branch (OPS-14).
      - name: Verify tagged commit is an ancestor of main
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not reachable from origin/main — refusing to publish."
            exit 1
          fi
      # Delegated decision 2026-09-26 (W6b review): every `npm ci` in this job
      # runs with --ignore-scripts, because the job holds `id-token: write` (and
      # NODE_AUTH_TOKEN at publish). Neither lockfile has a package with install
      # scripts today (no `hasInstallScript`), and neither workspace declares
      # preinstall/install/postinstall/prepare — so the flag costs nothing and
      # keeps a future compromised dependency from running code at install time.
      # It does NOT isolate the dev toolchain (tsc/eslint/prettier/tests still
      # run below, as they must for the gate); full isolation would need a
      # separate unprivileged job handing an artifact over. `npm publish` itself
      # keeps lifecycle scripts: prepublishOnly (the gate) and prepack (staging).
      - run: npm ci --ignore-scripts
      - run: npm run build
      # ADR-001 Option B: `prepack` (scripts/stage-tessera.mjs) stages the
      # Tessera runtime closure into build/tessera and refuses an unbuilt or
      # absent workspace, so tessera/ must be installed and built before publish.
      # Delegated decision 2026-09-26 (W6b review): fail-closed — no
      # hashFiles('tessera/package.json') skip. The published package ships the
      # `tess`/`tessera-mcp` bins, so a release without tessera/ must fail here.
      # `npm run check` is the full Tessera gate (build + lint + format:check +
      # test, under scripts/build-lock.mjs), and it leaves every
      # packages/*/build in place for staging.
      - name: Tessera workspace gate
        working-directory: tessera
        run: |
          npm ci --ignore-scripts
          npm run check
      # Delegated decision 2026-09-26 (W6b review): the SDIST smoke gates the
      # release too — pack the root package exactly as publish would, install
      # it offline into a fresh prefix and run all three bins from that copy.
      # It never publishes, and it restores build/tessera as it found it.
      - name: SDIST smoke (packed tarball, offline install)
        run: npm run smoke:sdist
      # Guard against publishing a version that doesn't match the tag.
      # A dry run has no tag; it checks package.json's version (OPS-14).
      - name: Verify tag matches package.json version
        if: env.DRY_RUN != 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # Delegated decision 2026-10-22 (ADR-001 follow-up 1): `prepack` stages
      # Tessera into ANY publish from main, so a 0.x tag cut from main would
      # ship `tess`/`tessera-mcp` while ADR-001 promises 0.x keeps shipping
      # preflight checks unchanged. main is the 1.0.0 train; this workflow
      # refuses every 0.x version. A 0.x patch needs a maintenance branch cut
      # from the v0.5.0 tag and its own release path (see docs/RELEASING.md).
      - name: Refuse a 0.x version from the 1.0.0 train
        run: |
          PKG="$(node -p "require('./package.json').version")"
          case "$PKG" in
            0.*)
              echo "::error::Version $PKG is 0.x — main ships Tessera, which ADR-001 holds back until v1.0.0. Refusing to publish."
              exit 1
              ;;
          esac
      # `prepublishOnly` runs the full `check` gate (build + lint + format:check + coverage).
      # `--provenance` requires `id-token: write` (above) and publishes a signed
      # provenance attestation. It works with both a token and OIDC Trusted Publishing.
      # REL-6: the dist-tag is always explicit. A prerelease (any version with a
      # `-` before any `+build` part, e.g. 1.0.0-rc.1) goes to `next`; without `--tag` npm would move
      # `latest` to it and every plain `npm install` would get the rc.
      # OPS-14: a dry run adds `--dry-run` (prepack and prepublishOnly still
      # run) and gets no token; the output, with the tarball listing, is kept
      # in $RUNNER_TEMP/npm-publish.log (outside the checkout) for the
      # artifact step below.
      - name: Publish to npm
        run: |
          set -o pipefail
          PKG="$(node -p "require('./package.json').version")"
          case "${PKG%%+*}" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            set -- --dry-run
            echo "Dry run: packing $PKG for dist-tag $DIST_TAG, publishing nothing"
          else
            set --
            echo "Publishing $PKG with dist-tag $DIST_TAG"
          fi
          npm publish --provenance --access public --tag "$DIST_TAG" "$@" 2>&1 | tee "${RUNNER_TEMP:-.}/npm-publish.log"
        env:
          # OIDC Trusted Publishing is the intended long-term auth path. Keep
          # NODE_AUTH_TOKEN until npmjs.com Trusted Publishing is configured for
          # this repo/workflow — the two changes must land together. DELETE this
          # env AND the NPM_TOKEN secret only AFTER Trusted Publishing is live.
          # See docs/RELEASING.md. A dry run never receives the token.
          NODE_AUTH_TOKEN: ${{ env.DRY_RUN != 'true' && secrets.NPM_TOKEN || '' }}
      - name: Upload the dry-run tarball listing
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publish-dry-run
          path: ${{ runner.temp }}/npm-publish.log
          if-no-files-found: error
