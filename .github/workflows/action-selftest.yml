name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runs the composite action in this repo against the committed recording
# (test/fixtures/replay-sample): no secrets, no instance, no network calls
# to ServiceNow.
permissions:
  contents: read

concurrency:
  group: action-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: preflight
        uses: ./
        with:
          # The checkout itself, so the action runs this commit's CLI.
          version: ${{ github.workspace }}
          replay: test/fixtures/replay-sample
          only: instance-url-configured,connectivity-auth,acl-role-sanity
          # Fork PRs get a read-only token; skip the upload there.
          sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          sarif-category: servicenow-preflight-selftest
      - name: Check the action outputs
        shell: bash
        env:
          OK: ${{ steps.preflight.outputs.ok }}
          PASS: ${{ steps.preflight.outputs.pass }}
          WARN: ${{ steps.preflight.outputs.warn }}
          FAIL: ${{ steps.preflight.outputs.fail }}
          REPORT: ${{ steps.preflight.outputs.report-json }}
        run: |
          set -euo pipefail
          echo "ok=$OK pass=$PASS warn=$WARN fail=$FAIL"
          [ "$OK" = "true" ] && [ "$PASS" = "2" ] && [ "$WARN" = "1" ] && [ "$FAIL" = "0" ]
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!r.runs?.[0]?.replay) process.exit(1);' "$REPORT"
